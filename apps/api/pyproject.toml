[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astraos-api"
version = "0.0.1"
description = "AstraOS API — merchant-side decision engine for agentic commerce"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
semantic = [
    "sentence-transformers>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "integration_llm: live LLM provider tests skipped without credentials",
    "semantic_model_integration: live sentence-transformer inference; skipped unless cached",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests"]
exclude = [".venv", "alembic", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/routes/*.py" = ["B008"]
"tests/*.py" = ["B017"]

[tool.mypy]
python_version = "3.12"
pretty = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["alembic", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "sentence_transformers"]
ignore_missing_imports = true
