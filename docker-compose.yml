services:
  db:
    image: postgres:16-alpine
    container_name: astraos-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astraos}
      POSTGRES_USER: ${POSTGRES_USER:-astraos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astraos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astraos} -d ${POSTGRES_DB:-astraos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    container_name: astraos-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      POSTGRES_DB: ${POSTGRES_DB:-astraos}
      POSTGRES_USER: ${POSTGRES_USER:-astraos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astraos}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ASTRAOS_SEED: ${ASTRAOS_SEED:-2026}
      ASTRAOS_DEMO_MODE: ${ASTRAOS_DEMO_MODE:-true}
      INTENT_PARSER_MODE: ${INTENT_PARSER_MODE:-llm}
      RESPONSE_MODEL_MODE: ${RESPONSE_MODEL_MODE:-COLD_START}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-8}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      PROTOCOL_ADAPTER: ${PROTOCOL_ADAPTER:-rest}
      SEMANTIC_EMBEDDING_PROVIDER: ${SEMANTIC_EMBEDDING_PROVIDER:-sentence_transformer}
      SEMANTIC_EMBEDDING_MODEL: ${SEMANTIC_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      SEMANTIC_EMBEDDING_BATCH_SIZE: ${SEMANTIC_EMBEDDING_BATCH_SIZE:-32}
      SEMANTIC_EMBEDDING_ALLOW_DOWNLOAD: ${SEMANTIC_EMBEDDING_ALLOW_DOWNLOAD:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: astraos-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
